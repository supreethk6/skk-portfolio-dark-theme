# Author: Supreeth Kumar K (SKK)
# Lychee link checker config — used in CI to verify all internal + external links resolve.

# Verbose level for CI output
verbose = "info"

# Cache results for 1 day so repeated CI runs are fast
cache = true
max_cache_age = "1d"

# Timeouts
timeout = 20
max_redirects = 10
max_retries = 2
retry_wait_time = 2

# Exclude social mailto and intentionally-broken anchors used during development
exclude = [
  "^mailto:",
  "^#$",
  "^javascript:"
]

# Treat GitHub rate-limit responses (429) as success so CI doesn't flap
accept = [200, 206, 301, 302, 304, 307, 308, 429]

# Headers (some sites block default user-agents)
headers = ["User-Agent=Mozilla/5.0 (compatible; SKK-Portfolio-LinkCheck/1.0)"]
